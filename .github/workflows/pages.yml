name: Publish study website
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/build-data.py
      - run: node scripts/check-javascript.js
      - run: node scripts/check-workspace.js
      - run: node scripts/check-inputs.js
      - run: python3 scripts/check-studio.py
      - run: node scripts/check-immersive.js
      - run: node scripts/check-editor-submit.js
      - run: python3 scripts/check-theory.py
      - run: python3 scripts/check-content.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - uses: actions/deploy-pages@v4
        id: deployment
